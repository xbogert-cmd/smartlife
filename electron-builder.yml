appId: com.smartlife.app
productName: SmartLife
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/whisper-cli
    to: whisper-cli
mac:
  category: public.app-category.productivity
  extendInfo:
    NSMicrophoneUsageDescription: "SmartLife uses your microphone to let you talk to the AI assistant."
  target:
    - target: dir
